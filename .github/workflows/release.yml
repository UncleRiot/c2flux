name: Build and Release c2flux

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.3.4"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Release-Tag ermitteln
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $tag = "${{ inputs.tag }}"
          }
          else {
              $tag = "${{ github.ref_name }}"
          }

          if (-not $tag.StartsWith("v")) {
              throw "Release tag must start with 'v'"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0

      - name: .NET 8 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore c2flux.sln

      - name: Versionsinformationen ermitteln
        id: version
        shell: pwsh
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          $version = $tag.TrimStart("v")
          $baseVersion = $version.Split("-")[0]
          $assemblyVersion = "$baseVersion.0"
          $isPrerelease = $version -match "-(alpha|beta|rc)(\.|$)"

          "version=$version" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "is_prerelease=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Projekt veröffentlichen
        run: >
          dotnet publish c2flux.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output publish
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }}
          -p:FileVersion=${{ steps.version.outputs.assembly_version }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: ZIP erstellen
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "publish\*" `
            -DestinationPath "c2flux-v${{ steps.version.outputs.version }}-win-x64.zip"

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: c2flux ${{ steps.release_tag.outputs.tag }}
          files: c2flux-v${{ steps.version.outputs.version }}-win-x64.zip
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.is_prerelease }}

      - name: CHANGELOG.md aktualisieren
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          $body = gh release view $tag --json body --jq '.body'

          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout "${{ github.event.repository.default_branch }}"
          git pull --ff-only origin "${{ github.event.repository.default_branch }}"

          $existing = ""
          if (Test-Path "CHANGELOG.md") {
              $existing = Get-Content "CHANGELOG.md" -Raw -Encoding UTF8
          }

          $heading = "## Changelog $tag"

          if ($existing -match [regex]::Escape($heading)) {
              Write-Host "$heading already exists"
              exit 0
          }

          $section = "$heading`r`n`r`n$body`r`n`r`n"

          [System.IO.File]::WriteAllText(
              (Join-Path $PWD "CHANGELOG.md"),
              $section + $existing,
              [System.Text.UTF8Encoding]::new($false)
          )

      - name: CHANGELOG.md committen
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if (git diff --cached --quiet) {
              exit 0
          }

          git commit -m "Update CHANGELOG for ${{ steps.release_tag.outputs.tag }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
